[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "family-archive-toolkit"
version = "0.1.0"
description = "CLI toolkit for digitizing, organizing, transcribing, and searching family archives"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mark Mackelprang"}
]
keywords = ["family", "archive", "genealogy", "transcription", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "imagehash>=4.3.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "olefile>=0.47",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "assemblyai>=0.30.0",
    "anthropic>=0.30.0",
]
audio = [
    "openai-whisper>=20230918",
]
all = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "assemblyai>=0.30.0",
    "anthropic>=0.30.0",
    "openai-whisper>=20230918",
    "exifread>=3.0.0",
]

[project.scripts]
family-archive = "scripts.cli:main"

[project.urls]
Homepage = "https://github.com/mmackelprang/HistoryTools"
Repository = "https://github.com/mmackelprang/HistoryTools"
Issues = "https://github.com/mmackelprang/HistoryTools/issues"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.setuptools.package-data]
scripts = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
